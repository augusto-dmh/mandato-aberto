name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit in the PR
        run: |
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B "$sha" | scripts/check-commit-msg.sh -
          done
  etl:
    name: etl tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest
  # The site job (npm test, astro build) is added by its feature.
