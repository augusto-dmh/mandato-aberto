name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit in the PR
        run: |
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B "$sha" | scripts/check-commit-msg.sh -
          done
  # Jobs for the ETL (uv run pytest) and the site (npm test, astro build) are added by their features.
