name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit in the PR
        run: |
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B "$sha" | scripts/check-commit-msg.sh -
          done
  etl:
    name: etl tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - name: Validate the site fixture against the contract
        run: uv run mandato-etl validate ../site/tests/fixtures/out
  site:
    name: site tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      MANDATO_DATA_DIR: tests/fixtures/out
      MANDATO_PHOTOS: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
  design:
    name: design tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            design/package-lock.json
            site/package-lock.json
      - name: Install
        run: npm ci
      - name: Install the site (tests read its forbidden-terms list)
        run: npm ci --prefix ../site
      - name: Build tokens
        run: npm run build
      - name: Test
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Layout tests
        run: npm run test:e2e
  app:
    name: app tests and gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      # where `playwright install` puts the card renderer's browser; wins over `.env.example`'s Sail path
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            design/package-lock.json
            app/package-lock.json
      - name: Build the design tokens
        working-directory: design
        run: npm ci && npm run build
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare the environment
        run: cp .env.example .env && php artisan key:generate
      - name: Pint
        run: vendor/bin/pint --test
      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Build the client, SSR and card renderer bundles
        run: npm ci && npm run build
      # the locked playwright-core, never a registry fetch: its browser revision is the one the lock and the Sail image pin
      - name: Install the card renderer's browser (share-cards door 3)
        run: npx --no-install playwright-core install --with-deps --only-shell chromium
      - name: Start the SSR server
        run: |
          nohup php artisan inertia:start-ssr > storage/logs/ssr.log 2>&1 &
          timeout 30 sh -c 'until curl -sf http://127.0.0.1:13714/health; do sleep 1; done'
      - name: Test
        run: php artisan test
